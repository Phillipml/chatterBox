services:
  mongo:
    image: mongo:8
    container_name: chatterbox-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  api:
    build: ./backend
    container_name: chatterbox-api
    ports:
      - "8000:8000"
    environment:
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: chatterbox
      CORS_ORIGINS: http://localhost:5173
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_data: